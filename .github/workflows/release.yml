name: Signed release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          values = dict(line.split('=', 1) for line in Path('version.properties').read_text().splitlines() if '=' in line)
          assert os.environ['RELEASE_TAG'] == 'v' + values['versionName'], 'Tag must match version.properties'
          PY
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AYAME_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Release signing secrets are not configured.'; exit 1; }
          mkdir -p .signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .signing/ayame-tv-release.jks
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build signed APK and run checks
        env:
          AYAME_KEYSTORE: .signing/ayame-tv-release.jks
          AYAME_STORE_PASSWORD: ${{ secrets.AYAME_STORE_PASSWORD }}
          AYAME_KEY_ALIAS: ${{ secrets.AYAME_KEY_ALIAS }}
          AYAME_KEY_PASSWORD: ${{ secrets.AYAME_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:testDebugUnitTest :app:lintRelease
      - name: Prepare release assets
        run: python scripts/create-release-metadata.py --apk app/build/outputs/apk/release/app-release.apk --output release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --title "Ayame TV $RELEASE_TAG" --generate-notes
      - name: Remove temporary signing key
        if: always()
        run: rm -f .signing/ayame-tv-release.jks
